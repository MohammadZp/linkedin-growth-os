[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "linkedin-growth-os"
version = "0.1.0"
description = "Personal LinkedIn growth management system controlled through Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.34.0",
    "sqlalchemy==2.1.9",
    "apscheduler==3.11.3",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "alembic==1.20.1",
    "tzdata==2026.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
# Persian user-facing text legitimately contains Arabic-script characters, and
# English docstrings use en-dashes for ranges; RUF001/RUF002 flag these as
# "ambiguous", which is a false positive here.
ignore = ["RUF001", "RUF002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
