services:
  bot:
    build: .
    image: linkedin-growth-os:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# The bot polls Telegram outbound only. It must
# not be scaled beyond a single instance, so no ports are published and no
# replicas are configured.

volumes:
  data:
